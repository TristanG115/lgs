verification:
  install:
    executable: npm
    args: [ci]
    category: package-manager
    timeoutMs: 600000
  typecheck:
    executable: npm
    args: [run, typecheck]
    category: build
  lint:
    executable: npm
    args: [run, lint]
    category: test
  targetedTest:
    executable: npx
    args: [vitest, run, "{targets}"]
    category: test
    include: ["test/**"]
  test:
    executable: npm
    args: [test]
    category: test
  build:
    executable: npm
    args: [run, build]
    category: build
  start:
    executable: npm
    args: [run, dev]
    category: process

permissions:
  commands:
    default: ask
    categories:
      build: always_allow
      test: always_allow
      package-manager: ask
      process: ask
      dangerous: deny

completion:
  gates:
    acceptance_criteria_addressed: true
    implementation_complete: true
    relevant_tests_added_or_updated: true
    targeted_tests_pass: true
    full_tests_pass: true
    typecheck_passes: true
    lint_passes: true
    build_succeeds: true
    documentation_current: true
    codebase_map_current: true
    runtime_verification_passes: false
    independent_review_passes: false
    no_unresolved_task_failures: true
  failureBudgets:
    same_error_retry_limit: 3
    total_fix_attempt_limit: 12
    escalation_threshold: 3

agents:
  readOnlyConcurrency: 2
  maxWorkersPerBatch: 6
  maxContextMessages: 30
